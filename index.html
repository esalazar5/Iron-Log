<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef0ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121416" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Iron Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Iron <span>Log</span></h1>
    <div class="status" id="status">Connecting…</div>
  </header>
  <main id="view"></main>
  <p class="credit">Exercise data from exercises-dataset by Hasan Emir Yıldırım (MIT). Demo animations © Gym visual, gymvisual.com, viewed on GitHub.</p>
</div>
<div class="rest" id="rest" hidden>
  <span class="small">Rest</span><span class="t" id="rest-t">2:00</span>
  <button type="button" data-act="rest-add">+30s</button>
  <button type="button" data-act="rest-stop">Done</button>
</div>
<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button type="button" data-tab="log"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Log</button>
    <button type="button" data-tab="history"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>History</button>
    <button type="button" data-tab="body"><svg viewBox="0 0 24 24"><path d="M5 20h14l-2-12H7z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>Body</button>
    <button type="button" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 19l5-6 4 3 7-9"/><path d="M15 7h5v5"/></svg>Progress</button>
  </div>
</nav>

<script src="app.js"></script>

</body>
</html>
